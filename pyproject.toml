[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "trainer-project"
version = "0.1.0"
description = "Reproducible Lightning and Hydra image research trainer"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "torch==2.8.0", "lightning>=2.5,<2.6", "hydra-core==1.3.2",
  "omegaconf==2.3.0", "numpy>=1.26,<3", "Pillow>=10.4,<13",
  "scikit-learn>=1.5,<2", "tensorboard>=2.18,<3", "PyYAML>=6,<7",
]

[project.optional-dependencies]
vision = ["timm>=1.0,<2", "torchvision==0.23.0", "transformers>=4.48,<5"]
augmentations = ["albumentations>=2,<3", "kornia>=0.8,<0.9"]
data = ["datasets>=3,<5", "pycocotools>=2.0.8,<3"]
wandb = ["wandb>=0.19,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
trainer = "trainer_project.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trainer_project"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
cache-dir = ".cache/uv"
